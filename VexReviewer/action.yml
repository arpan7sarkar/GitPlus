name: 'VexReview - AI-Powered PR Reviewer & Summarizer'
description: 'AI-Powered PR Reviewer & Summarizer with Chat Capabilities — part of the CodebaseGPT ecosystem'
branding:
  icon: 'git-merge'
  color: 'blue'
author: 'devsouvik'
inputs:
  debug:
    required: false
    description: 'Enable debug mode'
    default: 'false'
  max_files:
    required: false
    description:
      'Max files to summarize and review. Less than or equal to 0 means no
      limit.'
    default: '150'
  review_simple_changes:
    required: false
    description: 'Review even when the changes are simple'
    default: 'false'
  review_comment_lgtm:
    required: false
    description: 'Leave comments even if the patch is LGTM'
    default: 'false'
  path_filters:
    required: false
    description: |
      The path filters, e.g., "src/**.py", "!dist/**", each line will be considered as one pattern.
      See also

      - https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onpushpull_requestpull_request_targetpathspaths-ignore
      - https://github.com/isaacs/minimatch
    default: |
      !dist/**
      !**/*.app
      !**/*.bin
      !**/*.bz2
      !**/*.class
      !**/*.db
      !**/*.csv
      !**/*.tsv
      !**/*.dat
      !**/*.dll
      !**/*.dylib
      !**/*.egg
      !**/*.glif
      !**/*.gz
      !**/*.xz
      !**/*.zip
      !**/*.7z
      !**/*.rar
      !**/*.zst
      !**/*.ico
      !**/*.jar
      !**/*.tar
      !**/*.war
      !**/*.lo
      !**/*.log
      !**/*.mp3
      !**/*.wav
      !**/*.wma
      !**/*.mp4
      !**/*.avi
      !**/*.mkv
      !**/*.wmv
      !**/*.m4a
      !**/*.m4v
      !**/*.3gp
      !**/*.3g2
      !**/*.rm
      !**/*.mov
      !**/*.flv
      !**/*.iso
      !**/*.swf
      !**/*.flac
      !**/*.nar
      !**/*.o
      !**/*.ogg
      !**/*.otf
      !**/*.p
      !**/*.pdf
      !**/*.doc
      !**/*.docx
      !**/*.xls
      !**/*.xlsx
      !**/*.ppt
      !**/*.pptx
      !**/*.pkl
      !**/*.pickle
      !**/*.pyc
      !**/*.pyd
      !**/*.pyo
      !**/*.pub
      !**/*.pem
      !**/*.rkt
      !**/*.so
      !**/*.ss
      !**/*.eot
      !**/*.exe
      !**/*.pb.go
      !**/*.lock
      !**/*.ttf
      !**/*.yaml
      !**/*.yml
      !**/*.cfg
      !**/*.toml
      !**/*.ini
      !**/*.mod
      !**/*.sum
      !**/*.work
      !**/*.json
      !**/*.mmd
      !**/*.svg
      !**/*.jpeg
      !**/*.jpg
      !**/*.png
      !**/*.gif
      !**/*.bmp
      !**/*.tiff
      !**/*.webm
      !**/*.woff
      !**/*.woff2
      !**/*.dot
      !**/*.md5sum
      !**/*.wasm
      !**/*.snap
      !**/*.parquet
      !**/gen/**
      !**/_gen/**
      !**/generated/**
      !**/@generated/**
      !**/vendor/**
      !**/*.min.js
      !**/*.min.js.map
      !**/*.min.js.css
      !**/*.tfstate
      !**/*.tfstate.backup
  disable_review:
    required: false
    description: 'Only provide the summary and skip the code review.'
    default: 'false'
  disable_release_notes:
    required: false
    description: 'Disable release notes'
    default: 'false'
  gemini_light_model:
    required: false
    description:
      'Gemini model to use for simple tasks like summarizing diff on a file.'
    default: 'gemini-flash-latest'
  gemini_heavy_model:
    required: false
    description: 'Gemini model to use for complex tasks such as code reviews.'
    default: 'gemini-flash-latest'
  gemini_model_temperature:
    required: false
    description: 'Temperature for Gemini model'
    default: '0.7'
  gemini_retries:
    required: false
    description:
      'How many times to retry Gemini API in case of timeouts or errors?'
    default: '5'
  gemini_timeout_ms:
    required: false
    description: 'Timeout for Gemini API call in millis'
    default: '360000'
  gemini_concurrency_limit:
    required: false
    description: 'How many concurrent API calls to make to Gemini servers?'
    default: '6'
  github_concurrency_limit:
    required: false
    description: 'How many concurrent API calls to make to GitHub?'
    default: '6'
  system_message:
    required: false
    description: 'System message to be sent to Gemini'
    default: |
      You are `@vexreview` (aka `github-actions[bot]`), an AI code reviewer
      built for the **CodebaseGPT** ecosystem (powered by Actan Vector DB).
      Your purpose is to act as a highly experienced 
      software engineer and provide a thorough review of the code hunks
      and suggest code snippets to improve key areas such as:
        - Logic
        - Security
        - Performance
        - Data races
        - Consistency
        - Error handling
        - Maintainability
        - Modularity
        - Complexity
        - Optimization
        - Best practices: DRY, SOLID, KISS

      Do not comment on minor code style issues, missing 
      comments/documentation. Identify and resolve significant 
      concerns to improve overall code quality while deliberately 
      disregarding minor issues.
  summarize:
    required: false
    description: 'The prompt for final summarization response'
    default: |
      You are tasked with generating a high-quality PR review summary.
      
      Here is the PR Title:
      `$title`
      
      Here is the PR Description:
      `$description`

      Review the summary of changes provided previously and provide your final response ONLY in markdown, using exactly the following four sections. Do NOT omit any section. Do NOT add any extra conversational text.

      ## 📝 PR Summary
      A high-level summary of the overall change instead of specific files within 80 words.

      ## 📂 Changed Files
      A markdown table of files and their changes. Group files with similar changes together into a single row to save space. Use the columns: File, Action, Description.

      ## 🩺 PR Health
      Provide a "PR Health" score as either "Good" 🟢 or "Bad" 🔴 based on the code quality, logic, and potential issues.

      ## 💡 Suggestions
      If the PR Health is "Bad" or there are areas for improvement, provide a concise list of actionable suggestions. If the PR Health is "Good", you can provide a unique positive comment or celebration of the good code. Ensure this is formatted as a bulleted list.

      Make sure to return ONLY the above 4 markdown headers and their contents. Ensure the titles "PR Summary", "Changed Files", "PR Health", and "Suggestions" are exactly H2.

  summarize_release_notes:
    required: false
    description:
      'The prompt for generating release notes in the same chat as summarize
      stage'
    default: |
      Craft concise release notes for the pull request. 
      Focus on the purpose and user impact, categorizing changes as "New Feature", "Bug Fix", 
      "Documentation", "Refactor", "Style", "Test", "Chore", or "Revert". Provide a bullet-point list, 
      e.g., "- New Feature: Added search functionality to the UI". Limit your response to 50-100 words 
      and emphasize features visible to the end-user while omitting code-level details.
  language:
    required: false
    description: ISO code for the response language
    default: en-US
  bot_icon:
    required: false
    description: 'The icon for the bot'
    default: '🤖'
runs:
  using: 'node20'
  main: 'dist/index.js'

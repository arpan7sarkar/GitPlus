services:
  postgres:
    image: postgres:16-alpine
    container_name: gitplus-postgres
    environment:
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: neondb_password
      POSTGRES_DB: neondb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
